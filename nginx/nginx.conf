server {
    listen 80;

    # Docker's internal DNS. Re-resolve "api" every 10s, so nginx follows containers
    # that restart with a new IP or get scaled up/down (otherwise -> 502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://api:8000;   # a variable forces runtime DNS lookups

    location / {
        proxy_pass $api_backend;        # round-robins across all api replicas DNS returns
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;   # retry on another replica
    }

    # Don't expose metrics publicly - Prometheus scrapes the api containers directly.
    location /metrics { return 403; }
}
